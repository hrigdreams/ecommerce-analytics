spring.application.name=ecommerce-analytics
server.port=8080

# ---------------------------------------------------------------------
# Spring AI (leftover?) - remove this line AND the spring-ai dependency
# in pom.xml if you are not using Spring AI / vector stores.
# ---------------------------------------------------------------------
spring.autoconfigure.exclude=org.springframework.ai.vectorstore.elasticsearch.autoconfigure.ElasticsearchVectorStoreAutoConfiguration

# ---------------------------------------------------------------------
# PostgreSQL
# Secrets come from environment variables; defaults are for local dev only.
# In IntelliJ: Run > Edit Configurations > Environment variables
#   DB_USERNAME=postgres;DB_PASSWORD=your_password
# ---------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ecommerce_analytics}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------------------------------------------------------------------
# JPA / Hibernate
# ddl-auto=update creates product_analytics and processed_events
# automatically. Switch to validate + Flyway/Liquibase later.
# ---------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---------------------------------------------------------------------
# Kafka - connection
# ---------------------------------------------------------------------
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.admin.fail-fast=false

# ---------------------------------------------------------------------
# Kafka - producer
# acks=all + idempotence prevents duplicate messages from producer retries
# ---------------------------------------------------------------------
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.properties[spring.json.add.type.headers]=false
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties[enable.idempotence]=true

# ---------------------------------------------------------------------
# Kafka - consumer
# Values arrive as raw JSON strings; the router parses them.
# earliest = a new consumer group reads from the start of the topic,
# so events sent while the app was down are not skipped.
# ---------------------------------------------------------------------
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest

# ---------------------------------------------------------------------
# Application-specific Kafka settings
# ---------------------------------------------------------------------
app.kafka.topics.domain-events=ecommerce.domain.events.v1
app.kafka.consumer.group-id=analytics-consumer

# ---------------------------------------------------------------------
# Actuator
# ---------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ---------------------------------------------------------------------
# Live traffic simulator (com.ecommerce.analytics.simulator)
# Generates realistic activity by calling this app's OWN REST API - never
# writes to Postgres or Kafka directly. OFF by default on both switches;
# turn enabled=true and either auto-start=true or POST /api/v1/simulator/start.
# ---------------------------------------------------------------------
app.simulator.enabled=true
app.simulator.auto-start=false
app.simulator.base-url=http://localhost:${server.port}
app.simulator.interval-ms=500
#200
app.simulator.iterations=200
# app.simulator.seed=42
app.simulator.user-pool-size=200
app.simulator.product-pool-size=300
# app.simulator.historical-cutoff=2026-09-23T00:00:00Z
